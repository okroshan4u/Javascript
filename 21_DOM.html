<!-- 
| Feature                | Array | NodeList  | HTMLCollection |
| ---------------------- | ----- | --------- | -------------- |
| Real array             | ✅     | ❌         | ❌              |
| DOM-specific           | ❌     | ✅         | ✅              |
| Contains only elements | ❌     | ❌         | ✅              |
| `forEach()`            | ✅     | ✅         | ❌              |
| `map / filter`         | ✅     | ❌         | ❌              |
| Live updates           | ❌     | Sometimes | ✅              |



In JavaScript, both NodeList and HTMLCollection are array-like DOM collections, but they are not real arrays,
so they do not support array methods like map, filter, or reduce. To convert them into a real array, 
we commonly use Array.from() or the spread operator (...). 
For example, Array.from(nodeList) or [...htmlCollection] creates a new array containing the same elements.
These approaches are preferred in modern JavaScript because they are clean, readable, and widely supported.
An older approach is using Array.prototype.slice.call(collection), which was mainly used for legacy browser support. 
Converting these collections into arrays allows us to use full array functionality while working with DOM elements.





-->
