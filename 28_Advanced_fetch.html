<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch in js</title>
</head>
<body style="background-color: black; color: white;">
    <h1>We will study Fetch</h1>
</body>

<script>
    const requestURl = "https://api.github.com/users/okroshan4u"
    const xhr = new XMLHttpRequest();
    // console.log(xhr)
    xhr.open('GET',requestURl)
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState)
        if(xhr.readyState === 4){
            // const data = this.responseText 
            // console.log(data.followers) // here we are getting this as undefined 
            // cuase when we get response from fetch then most of the time we 
            // get as a string and we can not apply . method to the string 

            const data = JSON.parse(this.responseText)
            // console.log(typeof data) // object , we have converted into obj now we can apply . method
            // console.log(data.followers)
            console.log(data)
            const div = document.createElement('div')
            div.className = "user"
            div.innerHTML= ` followers are : ${data.followers} and name is : ${data.name}`
            div.style.display = "flex"
            div.style.flexDirection = "column-reverse"

            const img = document.createElement("IMG")
            img.src = `${data.avatar_url}`
            img.style.height = "200px"
            img.style.width = "180px"

            console.log(img)

            div.appendChild(img)

            document.querySelector('body').appendChild(div)
            // console.log(div)
        } 
    }


    xhr.send()
</script>
</html>
